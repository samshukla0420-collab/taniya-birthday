<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Cake 🎂</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="particles"></div>

<section class="page birthday-page">

    <h1 class="page-title">
        Happy 19th Birthday 🎂
    </h1>

    <p class="page-subtitle">
        Make a wish, Darling ✨
    </p>

    <div class="cake-container">

        <div class="cake" id="cake">

            <div class="cake-top"></div>

            <div class="cake-left"></div>

            <div class="cake-right"></div>

            <div class="cream"></div>

            <div class="candle">

                <div class="flame"></div>

            </div>

        </div>

    </div>

    <p class="cut-text">
        👆 Tap the cake to cut the cake
    </p>

    <div class="message-box" id="messageBox">

        <h2>
            DARLING ❤️
        </h2>

        <h3>
            Happy 19th Birthday….
        </h3>

        <p>
            Happy birthday to the person who
            makes the good times better and the
            hard times easier.
            <br><br>

            You deserve all the happiness.
            <br><br>

            I hope at some point of my life
            we meet again… ❤️
        </p>

        <a href="memories.html"
           class="magic-btn">

            Memories 📸

        </a>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
